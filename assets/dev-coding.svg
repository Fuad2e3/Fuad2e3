<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220" role="img" aria-labelledby="t">
  <title id="t">Developer coding at a laptop with floating tech cubes and a holographic code panel</title>
  <defs>
    <linearGradient id="hoodie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#0F1E4A"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00C2FF" stop-opacity=".18"/>
      <stop offset="1" stop-color="#8E75FF" stop-opacity=".08"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#00C2FF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#00C2FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .o { stroke: #94A3B8; stroke-width: 1.5; stroke-linejoin: round; }
    .fb { transform-box: fill-box; transform-origin: center; }
    .bob { animation: bob 3s ease-in-out infinite; }
    .d1 { animation-delay: -1s; } .d2 { animation-delay: -2s; }
    @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }
    .type { animation: type .4s ease-in-out infinite alternate; }
    @keyframes type { from { transform: translateY(0) } to { transform: translateY(2.5px) } }
    .nod { animation: nod 4s ease-in-out infinite; transform-origin: 300px 104px; }
    @keyframes nod { 0%,70%,100% { transform: rotate(0) } 80% { transform: rotate(-4deg) } 90% { transform: rotate(3deg) } }
    .eye { animation: blink 4s infinite; }
    @keyframes blink { 0%,94%,100% { transform: scaleY(1) } 96% { transform: scaleY(.1) } }
    .line { transform-box: fill-box; transform-origin: left center; animation: code 3s steps(14) infinite; }
    .l2 { animation-delay: .5s; } .l3 { animation-delay: 1s; } .l4 { animation-delay: 1.5s; } .l5 { animation-delay: 2s; }
    @keyframes code { 0% { transform: scaleX(0) } 45%,90% { transform: scaleX(1) } 100% { transform: scaleX(0) } }
    .cursor { animation: cur 1s steps(1) infinite; }
    @keyframes cur { 50% { opacity: 0 } }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
    .bit { animation: fly 2.4s linear infinite; opacity: 0; }
    .b2 { animation-delay: .8s; } .b3 { animation-delay: 1.6s; }
    @keyframes fly { 0% { transform: translate(0,0); opacity: 0 } 15% { opacity: 1 } 85% { opacity: 1 } 100% { transform: translate(78px,-42px); opacity: 0 } }
    .spin { animation: spin 6s linear infinite; }
    @keyframes spin { to { stroke-dashoffset: -140 } }
    .tw { animation: tw 3s ease-in-out infinite; } .tw2 { animation-delay: -1.5s; }
    @keyframes tw { 0%,100% { opacity: .2 } 50% { opacity: .9 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>

  <!-- stars -->
  <g fill="#00C2FF">
    <circle class="tw" cx="40" cy="30" r="1.6"/><circle class="tw tw2" cx="230" cy="18" r="1.4"/>
    <circle class="tw" cx="370" cy="24" r="1.6"/><circle class="tw tw2" cx="560" cy="170" r="1.4"/>
    <circle class="tw tw2" cx="20" cy="150" r="1.4"/><circle class="tw" cx="410" cy="190" r="1.2"/>
  </g>

  <!-- floor glow + orbit -->
  <ellipse cx="300" cy="205" rx="190" ry="12" fill="url(#glow)"/>
  <g class="spin" fill="none" stroke="#00C2FF" stroke-opacity=".5" stroke-dasharray="4 10">
    <ellipse cx="300" cy="205" rx="150" ry="9"/>
  </g>

  <!-- floating isometric cubes: Flutter, Dart, Cloudflare -->
  <g class="bob">
    <path class="o" d="M70 70 l22 -12 l22 12 l-22 12z" fill="#54C5F8"/>
    <path class="o" d="M70 70 v26 l22 12 v-26z" fill="#02569B"/>
    <path class="o" d="M114 70 v26 l-22 12 v-26z" fill="#0175C2"/>
    <text x="92" y="74" font-family="monospace" font-size="7" fill="#fff" text-anchor="middle">Flutter</text>
  </g>
  <g class="bob d1">
    <path class="o" d="M140 120 l18 -10 l18 10 l-18 10z" fill="#40C4B0"/>
    <path class="o" d="M140 120 v20 l18 10 v-20z" fill="#00897B"/>
    <path class="o" d="M176 120 v20 l-18 10 v-20z" fill="#00B4AB"/>
    <text x="158" y="123" font-family="monospace" font-size="8" fill="#fff" text-anchor="middle">Dart</text>
  </g>
  <g class="bob d2">
    <path class="o" d="M40 140 l16 -9 l16 9 l-16 9z" fill="#FBAD41"/>
    <path class="o" d="M40 140 v18 l16 9 v-18z" fill="#F38020"/>
    <path class="o" d="M72 140 v18 l-16 9 v-18z" fill="#D9661A"/>
    <text x="56" y="143" font-family="monospace" font-size="7" fill="#1E293B" text-anchor="middle">CF</text>
  </g>

  <!-- chair -->
  <rect class="o" x="258" y="64" width="84" height="96" rx="16" fill="#0F172A"/>

  <!-- developer -->
  <g class="type">
    <path class="o" d="M262 168 q0 -48 20 -58 q18 -8 36 0 q20 10 20 58z" fill="url(#hoodie)"/>
    <path d="M290 112 l10 14 l10 -14" fill="none" stroke="#00C2FF" stroke-width="2"/>
  </g>
  <g class="nod">
    <rect x="293" y="96" width="14" height="12" fill="#E0AC85"/>
    <circle class="o" cx="300" cy="80" r="21" fill="#F2C6A0"/>
    <path d="M279 78 q2 -26 23 -24 q20 1 19 24 q-6 -12 -20 -12 q-14 0 -22 12z" fill="#1F2937"/>
    <g fill="#0F172A">
      <ellipse class="eye fb" cx="292" cy="83" rx="2.2" ry="2.6"/>
      <ellipse class="eye fb" cx="308" cy="83" rx="2.2" ry="2.6"/>
    </g>
    <path d="M294 91 q6 4 12 0" fill="none" stroke="#9A3412" stroke-width="1.6" stroke-linecap="round"/>
    <!-- headphones -->
    <path d="M278 80 q0 -30 22 -30 q22 0 22 30" fill="none" stroke="#8E75FF" stroke-width="3"/>
    <rect x="273" y="74" width="8" height="14" rx="3" fill="#8E75FF"/>
    <rect x="319" y="74" width="8" height="14" rx="3" fill="#8E75FF"/>
  </g>

  <!-- desk -->
  <path class="o" d="M150 160 h300 l-14 10 h-272z" fill="#475569"/>
  <path class="o" d="M164 170 h272 v8 h-272z" fill="#334155"/>

  <!-- laptop (back of lid facing us) -->
  <path class="o" d="M252 160 l8 -44 h80 l8 44z" fill="url(#lid)"/>
  <text class="pulse" x="300" y="143" font-family="monospace" font-weight="700" font-size="14" fill="#00C2FF" text-anchor="middle">&lt;/&gt;</text>
  <path class="o" d="M240 160 h120 l-6 4 h-108z" fill="#64748B"/>

  <!-- data bits flying to the panel -->
  <g fill="#00C2FF">
    <rect class="bit" x="345" y="120" width="4" height="4"/>
    <rect class="bit b2" x="345" y="120" width="4" height="4" fill="#8E75FF"/>
    <rect class="bit b3" x="345" y="120" width="4" height="4" fill="#34D399"/>
  </g>

  <!-- holographic code panel -->
  <g class="bob d1">
    <rect x="425" y="28" width="155" height="112" rx="10" fill="url(#panel)" stroke="#00C2FF" stroke-opacity=".7"/>
    <circle cx="438" cy="40" r="3" fill="#F87171"/><circle cx="448" cy="40" r="3" fill="#FBBF24"/><circle cx="458" cy="40" r="3" fill="#34D399"/>
    <rect class="line" x="438" y="54" width="90" height="6" rx="3" fill="#00C2FF"/>
    <rect class="line l2" x="450" y="68" width="110" height="6" rx="3" fill="#8E75FF"/>
    <rect class="line l3" x="450" y="82" width="70" height="6" rx="3" fill="#34D399"/>
    <rect class="line l4" x="462" y="96" width="96" height="6" rx="3" fill="#00C2FF"/>
    <rect class="line l5" x="438" y="110" width="56" height="6" rx="3" fill="#8E75FF"/>
    <rect class="cursor" x="500" y="108" width="3" height="10" fill="#E2E8F0"/>
  </g>
</svg>
